name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore API
        run: dotnet restore DevPilot.csproj

      - name: Restore tests
        run: dotnet restore tests/DevPilot.Core.Tests/DevPilot.Core.Tests.csproj

      - name: Build API
        run: dotnet build DevPilot.csproj --no-restore --configuration Release

      - name: Build tests
        run: dotnet build tests/DevPilot.Core.Tests/DevPilot.Core.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/DevPilot.Core.Tests/DevPilot.Core.Tests.csproj --no-build --configuration Release

      - name: Pack DevPilot.Core
        run: dotnet pack src/DevPilot.Core/DevPilot.Core.csproj --configuration Release --output ./artifacts
