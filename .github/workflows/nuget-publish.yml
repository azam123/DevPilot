name: Build and Publish NuGet

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore src/DevPilot.Core/DevPilot.Core.csproj

      - name: Build
        run: dotnet build src/DevPilot.Core/DevPilot.Core.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/DevPilot.Core/DevPilot.Core.csproj --configuration Release --no-build --output ./artifacts

      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
